name: Feature request
description: Suggest an idea or an improvement for Brow.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Brow shows the limits of every Claude Code account in the notch, signs each account in with one click, and runs parallel Claude Code sessions in workspaces of git worktrees (Workspaces, in the menu bar). To talk an idea through before filing it, use [Discussions → Ideas](https://github.com/efim0v/brow/discussions/categories/ideas).

  - type: dropdown
    id: component
    attributes:
      label: Which part of Brow
      options:
        - Notch and limits
        - Accounts and sign-in
        - Workspaces and sessions
        - brow command-line tool
        - Something else
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How it could work in Brow. Sketches and screenshots are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do now
      description: Workarounds or other tools you use for this today.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - Yes, I would like to open a pull request
        - Maybe, with some guidance
        - "No"
