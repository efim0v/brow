<!doctype html>
<!--
  Source of docs/media/social-preview.png and site/og.png (1280 x 640). To render, from the repository root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1280,640 \
      --screenshot="$PWD/docs/media/social-preview.png" "file://$PWD/docs/media/social-preview.html"
    cp docs/media/social-preview.png site/og.png

  The panel is docs/screenshots/brow-panel.png, cropped to the panel itself.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brow social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    background: #0b0b0f;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(420px 340px at 1210px 90px, rgba(246, 150, 196, .85), transparent 70%),
      radial-gradient(520px 360px at 1110px 620px, rgba(70, 86, 238, .95), transparent 72%),
      radial-gradient(440px 330px at 640px 520px, rgba(176, 104, 224, .70), transparent 72%);
  }
  .text {
    position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 38px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 56px; height: 56px; }
  h1 { margin: 34px 0 20px; font-size: 56px; line-height: 1.06; letter-spacing: -.028em; font-weight: 700; }
  p { margin: 0; color: #c9c9d3; font-size: 26px; line-height: 1.38; }
  .meta { margin-top: 30px; color: #9d9dab; font-size: 21px; }
  .panel {
    position: absolute; top: 0; left: 590px; width: 643px; height: 513px;
    overflow: hidden; border-radius: 0 0 20px 20px;
    box-shadow: 0 34px 90px -24px rgba(0, 0, 0, .85), 0 0 0 1px rgba(255, 255, 255, .07);
  }
  .panel img { position: absolute; top: 0; left: -126px; width: 896px; height: auto; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="wallpaper" x1="0" y1="0" x2=".35" y2="1">
            <stop offset="0" stop-color="#f9c6c9"/>
            <stop offset=".45" stop-color="#c37fd8"/>
            <stop offset="1" stop-color="#3f4bd6"/>
          </linearGradient>
          <clipPath id="tile"><rect width="64" height="64" rx="15"/></clipPath>
        </defs>
        <g clip-path="url(#tile)">
          <rect width="64" height="64" fill="url(#wallpaper)"/>
          <path d="M7 0h50v17a11 11 0 0 1-11 11H18A11 11 0 0 1 7 17z" fill="#000"/>
          <circle cx="19.5" cy="14" r="5.5" fill="#34c759"/>
          <circle cx="44.5" cy="14" r="5.5" fill="#ff9f0a"/>
        </g>
      </svg>
      Brow
    </div>
    <h1>Claude Code rate limits in the MacBook notch</h1>
    <p>Every account’s 5-hour and weekly limits, and when each resets.</p>
    <p class="meta">Free and open source · macOS 26+ · Apple silicon</p>
  </div>
  <div class="panel"><img src="../screenshots/brow-panel.png" alt=""></div>
</body>
</html>
