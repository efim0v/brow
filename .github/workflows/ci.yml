name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it.
# Runs for main are never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    # Package.swift targets macOS 26 with swift-tools-version 6.2, but Swift 6.2.4
    # cannot compile BrowKit, so this relies on the image's newer default Xcode.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show versions
        run: |
          sw_vers
          xcode-select --print-path
          xcodebuild -version
          swift --version

      # The package has no dependencies: GroveCore, GroveAppKit, BrowKit, the app
      # and the command-line tool all build from this repository. A clean build of
      # every target that fails on any warning the script does not list.
      - name: Build with no new warnings
        run: Scripts/check-warnings.sh

      # HOME and CFFIXED_USER_HOME point at an empty folder; the script fails if the
      # suite leaves Brow's or Grove's data, or Claude Code's folders, in it.
      - name: Test in an empty home folder
        run: Scripts/test-in-empty-home.sh

      # Release builds are optimized (-O). ScanWorktreeCollectionTests covers a
      # release-only miscompile (see WorkspaceService.collectWorktrees).
      - name: Test (release)
        run: Scripts/test-in-empty-home.sh -c release

      - name: Build the app and the tool
        run: |
          Scripts/build-brow.sh
          codesign --verify --deep --strict --verbose=2 dist/Brow.app
          dist/brow --version
