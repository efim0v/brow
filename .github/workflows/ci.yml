name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it.
# Runs for main are never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    # Package.swift targets macOS 26 with swift-tools-version 6.2, but Swift 6.2.4
    # cannot compile BrowKit, so this relies on the image's newer default Xcode.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Package.resolved is git-ignored, so every run resolves grove afresh;
      # the tree shows which version it got.
      - name: Resolve dependencies
        run: |
          swift package resolve
          swift package show-dependencies

      - name: Build
        run: swift build

      - name: Test
        run: swift test
