name: Site

# Checks the head of every page in site/: lang, canonical and og:url, no
# noindex, a description, JSON-LD that parses, hreflang that points at real
# pages, and a sitemap that lists every page with its date.
on:
  pull_request:
    paths:
      - "site/**"
      - "Scripts/check_seo.py"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Scripts/check_seo.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for it.
# Runs for main are never cancelled mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check the pages' SEO head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check site/
        run: python3 Scripts/check_seo.py site https://efim0v.github.io/brow/
